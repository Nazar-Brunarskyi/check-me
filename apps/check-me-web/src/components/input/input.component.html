<div class="flex flex-col gap-y-2">
  @if (label()) {
  <label class="font-medium" [for]="name()"> {{ label() }} </label>
  }

  <div class="flex flex-col gap-y-1">
    <input
      [id]="name()"
      class="w-full"
      pInputText
      type="text"
      [value]="value"
      (input)="onInput($event)"
      (blur)="onTouched()"
      [disabled]="disabled()"
      [ngClass]="{ error: invalid() }"
    />
    @if (invalid() || errorMesaage()) {
    <span class="text-sm font-light text-red-500"> {{ errorMesaage() }} </span>
    }
  </div>
</div>
